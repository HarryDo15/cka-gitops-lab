apiVersion: v1
kind: Namespace
metadata:
  name: incident-desk
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cka-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: incident-desk-data
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: cka-local
  claimRef:
    namespace: incident-desk
    name: incident-desk-data
  local:
    path: /var/lib/incident-desk
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [lima-cka-lab]
