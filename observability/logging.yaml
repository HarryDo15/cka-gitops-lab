apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
spec:
  storageClassName: cka-observability
  accessModes: [ReadWriteOnce]
  selector:
    matchLabels: {observability-store: loki}
  resources:
    requests: {storage: 3Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
spec:
  replicas: 1
  progressDeadlineSeconds: 1200
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: loki}
  template:
    metadata:
      labels: {app: loki}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: loki
          image: grafana/loki:3.7.7
          args: [-config.file=/etc/loki/config.yaml]
          ports:
            - {name: http, containerPort: 3100}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 700m, memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /ready, port: http}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /ready, port: http}
          volumeMounts:
            - {name: config, mountPath: /etc/loki, readOnly: true}
            - {name: data, mountPath: /var/loki}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: loki-config}
        - name: data
          persistentVolumeClaim: {claimName: loki-data}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels: {app: loki}
spec:
  selector: {app: loki}
  ports:
    - {name: http, port: 3100, targetPort: http}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cka-observability-log-reader
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cka-observability-log-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cka-observability-log-reader
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
spec:
  replicas: 1
  progressDeadlineSeconds: 1200
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: alloy}
  template:
    metadata:
      labels: {app: alloy}
    spec:
      serviceAccountName: alloy
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: alloy
          image: grafana/alloy:v1.19.2
          args:
            - run
            - /etc/alloy/config.alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy
            - --disable-reporting
          ports:
            - {name: http, containerPort: 12345}
          resources:
            requests: {cpu: 75m, memory: 96Mi}
            limits: {cpu: 400m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 15
          volumeMounts:
            - {name: config, mountPath: /etc/alloy, readOnly: true}
            - {name: data, mountPath: /var/lib/alloy}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: alloy-config}
        - name: data
          emptyDir: {sizeLimit: 128Mi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  labels: {app: alloy}
spec:
  selector: {app: alloy}
  ports:
    - {name: http, port: 12345, targetPort: http}
