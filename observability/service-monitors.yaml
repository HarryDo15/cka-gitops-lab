apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loki
  namespace: monitoring
  labels: {release: monitoring}
spec:
  selector:
    matchLabels: {app: loki}
  endpoints:
    - {port: http, path: /metrics, interval: 30s}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alloy
  namespace: monitoring
  labels: {release: monitoring}
spec:
  selector:
    matchLabels: {app: alloy}
  endpoints:
    - {port: http, path: /metrics, interval: 30s}
